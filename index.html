<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>My Pastel PC</title>
<style>
@import url('https://fonts.googleapis.com/css2?family=Nunito:wght@400;500;600;700;800;900&family=Quicksand:wght@400;500;600;700&display=swap');
:root{--ink:#655873;--line:#eee3f4;--pink:#f5dce9;--purple:#e8e0fa;--blue:#dceefa}
*{box-sizing:border-box}
body,button,input,textarea,select{font-family:'Nunito','Quicksand',sans-serif;color:var(--ink)}
body{margin:0;height:100vh;overflow:hidden}
button{border:1px solid var(--line);background:#fffafd;border-radius:14px;padding:9px 13px;cursor:pointer;font-weight:800;transition:.18s}
button:hover{transform:translateY(-2px);box-shadow:0 6px 16px #78668b20}
button:disabled{opacity:.5;cursor:not-allowed}
input,textarea,select{border:1px solid var(--line);border-radius:13px;padding:10px;background:#fffdfd;max-width:100%;outline:none}
input:focus,textarea:focus,select:focus{border-color:#c9a9df;box-shadow:0 0 0 3px #eee4f8}
input[type=color]{width:43px;height:36px;padding:3px}
#wallpaper{position:fixed;inset:0;z-index:-2;background:linear-gradient(135deg,#dceefa,#e8e0fa,#f8e4ed);background-size:cover;background-position:center}
#desktop{height:calc(100vh - 52px);padding:22px;overflow:auto}
#top{display:flex;align-items:center;gap:12px;margin-bottom:24px}
#avatar{width:54px;height:54px;border-radius:20px;object-fit:cover;background:#fff9;border:2px solid white;box-shadow:0 4px 15px #65587322}
#pcname{font:800 23px 'Quicksand',sans-serif;letter-spacing:-.5px}
#subtitle{font-size:12px;opacity:.75;margin-top:4px}
#icons{display:grid;grid-template-columns:repeat(auto-fill,94px);gap:15px 12px;max-width:680px}
.app{width:92px;min-height:96px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:7px;padding:8px;background:#ffffff82;border:1px solid #ffffffc7;border-radius:23px;backdrop-filter:blur(13px);cursor:pointer;transition:.2s}
.app:hover{transform:translateY(-5px) scale(1.035);background:#ffffffed;box-shadow:0 12px 26px #74668d29}
.emoji{font-size:31px}
.app span:last-child{font-size:12px;font-weight:900}
#taskbar{position:fixed;bottom:0;left:0;right:0;height:52px;display:flex;align-items:center;gap:9px;padding:5px 12px;background:#ffffffdf;backdrop-filter:blur(22px);border-top:1px solid white;z-index:5000}
#startBtn{font-size:21px;padding:4px 12px}
#taskApps{display:flex;gap:5px;flex:1;overflow:auto}
.taskApp{padding:6px 10px;white-space:nowrap}
#systemTray{font-size:12px;white-space:nowrap}
#startMenu{display:none;position:fixed;left:10px;bottom:59px;width:275px;max-height:70vh;overflow:auto;padding:14px;background:#ffffffef;backdrop-filter:blur(20px);border:1px solid white;border-radius:23px;z-index:5001;box-shadow:0 15px 45px #665a7830}
#startMenu button{display:block;width:100%;text-align:left;margin-top:7px}
.window{position:fixed;left:50%;top:49%;transform:translate(-50%,-50%);width:min(720px,94vw);height:min(580px,80vh);background:#fffafdf5;backdrop-filter:blur(22px);border:1px solid white;border-radius:24px;box-shadow:0 18px 55px #76668d32;z-index:20;overflow:hidden;display:none}
.window.wide{width:min(960px,96vw);height:min(660px,85vh)}
.window.maximized{left:8px!important;top:8px!important;transform:none!important;width:calc(100vw - 16px)!important;height:calc(100vh - 68px)!important}
.titlebar{height:46px;display:flex;align-items:center;gap:9px;padding:0 13px;background:linear-gradient(90deg,#f8e8f2,#eee9ff,#e6f3fc);border-bottom:1px solid #eee5f2;cursor:grab;user-select:none}
.titlebar strong{flex:1;font-size:14px}
.winbtn{padding:4px 10px;border-radius:10px}
.winbody{height:calc(100% - 46px);overflow:auto;padding:15px}
.row{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.muted{font-size:12px;opacity:.75;line-height:1.6}
.panel{background:#ffffffc9;border:1px solid #f0e7f4;border-radius:18px;padding:12px}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:12px}
.photo{border:1px solid #eee3f2;border-radius:17px;overflow:hidden;background:white}
.photo img{display:block;width:100%;height:125px;object-fit:cover;cursor:zoom-in;transition:transform .2s}
.photo img:hover{transform:scale(1.035)}
.pinfo{padding:9px;font-size:12px;overflow-wrap:anywhere}
.pinfo button{font-size:11px;padding:5px 7px;margin:4px 2px 0 0}
#paintCanvas{display:block;width:100%;height:340px;background:white;border:1px solid var(--line);border-radius:16px;touch-action:none}
#paintUpload,#galleryUpload,#wallUpload,#avatarUpload{display:none}
#trashList{display:grid;gap:9px}
.trashItem{display:flex;align-items:center;gap:10px;flex-wrap:wrap;background:#fff;border:1px solid var(--line);border-radius:14px;padding:10px}
.trashItem .name{flex:1;min-width:100px}
#chatLayout{display:grid;grid-template-columns:180px minmax(0,1fr);gap:12px;height:100%}
#chatSide{background:#f5effb;border-radius:17px;padding:12px}
#chatMain{display:flex;flex-direction:column;gap:10px;min-width:0}
#chatMessages{flex:1;overflow:auto;background:white;border-radius:16px;padding:12px}
.bubble{padding:10px 12px;border-radius:15px;margin:7px 0;max-width:90%;background:#f2eafa;overflow-wrap:anywhere}
.bubble.me{margin-left:auto;background:#e4f2fb}
#chatForm{display:flex;gap:8px}
#chatInput{flex:1;min-width:0}
.secret-line{width:100%;text-align:left;padding:14px;background:linear-gradient(110deg,#fff,#f7efff);font-weight:900}
#secretPenguinArea{display:none;padding:12px;text-align:center}
#secretPenguin{font-size:68px;background:transparent;border:0;box-shadow:none}
#secretPenguin:hover{transform:scale(1.2) rotate(-5deg)}
#jumpscare{display:none;position:fixed;inset:0;z-index:100000;background:#08050c;color:white;align-items:center;justify-content:center;text-align:center;flex-direction:column}
#scareFace{font-size:min(48vw,340px);line-height:1;filter:drop-shadow(0 0 20px red);animation:scare .12s infinite alternate}
#scareWords{font-size:clamp(22px,5vw,48px);font-weight:900;color:#ff334f;text-shadow:0 0 15px red}
@keyframes scare{from{transform:scale(.9) rotate(-2deg)}to{transform:scale(1.08) rotate(2deg)}}
#imageViewer{display:none;position:fixed;inset:0;z-index:20000;background:#171322ef;align-items:center;justify-content:center;padding:20px}
#imageViewer.show{display:flex}
#imageViewer img{max-width:90vw;max-height:82vh;object-fit:contain;border-radius:16px;box-shadow:0 12px 50px #0005}
#viewerClose{position:absolute;top:18px;right:18px;background:#fff;font-size:20px}
#viewerCaption{position:absolute;bottom:15px;left:15px;right:15px;text-align:center;color:white;font-weight:800;overflow-wrap:anywhere}
.game-card{min-width:0;text-align:center;display:flex;flex-direction:column;align-items:center;gap:7px}
.game-icon{font-size:43px;line-height:1.3}
.game-name{font-weight:900;overflow-wrap:anywhere;max-width:100%}
.game-play{margin-top:3px}
.form-field{display:flex;flex-direction:column;gap:6px;margin:12px 0}
.form-field label{font-weight:900;font-size:13px}
.form-field input{width:100%}
#gameEmoji{font-size:22px}
#emojiPreview{font-size:35px;min-width:45px;text-align:center}

/* Công cụ hình vẽ kiểu PowerPoint */
#shapeTools{background:#f8f3fc;border:1px solid #eee3f4;border-radius:16px;padding:10px;margin:10px 0}
#shapeTools select{min-width:165px;flex:1}
.tool-label{font-size:12px;font-weight:900}
.shape-hint{font-size:12px;opacity:.75;margin:7px 0 0}
@media(max-width:560px){
 #desktop{padding:13px}
 #icons{grid-template-columns:repeat(3,minmax(0,1fr));gap:10px}
 .app{width:100%}
 .window{height:78vh}
 #chatLayout{grid-template-columns:1fr}
 #chatSide{display:none}
 #taskApps{max-width:40vw}
 .taskApp{font-size:11px}
}
</style>
</head>
<body>
<div id="wallpaper"></div>
<div id="desktop">
  <div id="top">
    <img id="avatar" alt="Avatar">
    <div><div id="pcname">My Pastel PC</div><div id="subtitle">A little world made just for you 🌿</div></div>
  </div>
  <div id="icons"></div>
</div>
<div id="startMenu"><strong>Start menu</strong><div id="startApps"></div></div>
<div id="taskbar"><button id="startBtn" title="Start menu">🌸</button><div id="taskApps"></div><span id="systemTray"></span></div>
<div id="windows"></div>
<input id="galleryUpload" type="file" accept="image/*" multiple>
<input id="paintUpload" type="file" accept="image/*">
<input id="wallUpload" type="file" accept="image/*">
<input id="avatarUpload" type="file" accept="image/*">

<div id="imageViewer" role="dialog" aria-modal="true" aria-label="Xem ảnh phóng to">
  <button id="viewerClose" aria-label="Đóng ảnh">✕</button>
  <img id="viewerImage" alt="Ảnh phóng to"><div id="viewerCaption"></div>
</div>
<div id="jumpscare" role="dialog" aria-label="Jumpscare">
  <div id="scareFace">😱</div><div id="scareWords">AAAAAA!!</div>
  <button id="scareClose" style="margin-top:25px">Đóng jumpscare ✕</button>
</div>

<script>
"use strict";
const $=s=>document.querySelector(s);
const SECRET_LINK="https://www.youtube.com/watch?v=dQw4w9WgXcQ";
const SECRET_MIDDLE_LINK="https://www.youtube.com/shorts/3ywZvTdXpgw";
const STORE="pastelPC_v5",GAMES_STORE="pastelPC_customGames_v1",MAX_GAMES=20000;
const defaults={wallpaper:"gradient",wallColor:"#e8e0fa",wallColor2:"#f8e4ed",wallpaperImage:"",avatar:"",pcname:"My Pastel PC"};
let settings={...defaults};
try{settings={...defaults,...JSON.parse(localStorage.getItem(STORE)||"{}")};if(settings.pcname)settings.pcname=settings.pcname.replace(/♡/g,"").trim()}catch{}
let gallery=[],trash=[],z=20,calcText="",clockTimer=null;
let altZeroTimes=[],jumpTimer=null,overloadUntil=0,secretMessageText="",customGames=[];
try{const saved=JSON.parse(localStorage.getItem(GAMES_STORE)||"[]");if(Array.isArray(saved))customGames=saved.slice(0,MAX_GAMES)}catch{}
const apps=[
{id:"gallery",name:"Gallery",icon:"🖼️"},{id:"paint",name:"Paint",icon:"🎨"},
{id:"files",name:"Files",icon:"📁"},{id:"notes",name:"Notes",icon:"📝"},
{id:"calc",name:"Calculator",icon:"🧮"},{id:"clock",name:"Clock",icon:"🕰️"},
{id:"trash",name:"Trash",icon:"🗑️"},
{id:"calendar",name:"Calendar",icon:"🗓️"},
{id:"secret",name:"Secret",icon:"🤫"},{id:"settings",name:"Settings",icon:"⚙️"},{id:"chat",name:"ChatGPT",icon:"💬"}];
const icons=$("#icons"),startApps=$("#startApps"),windows=$("#windows");

function saveSettings(){try{localStorage.setItem(STORE,JSON.stringify(settings));return true}catch(e){alert("Không lưu được cài đặt. Hãy thử ảnh có dung lượng nhỏ hơn nha!");return false}}
function dataImage(file,cb){if(!file||!file.type.startsWith("image/"))return;const r=new FileReader();r.onload=()=>cb(r.result);r.readAsDataURL(file)}
function art(type){
 const colors={
 meadow:["#dce8f8","#b9d7ca","#85b7a0"],sea:["#cfe7f4","#94d2df","#5dabc0"],
 forest:["#d9eaf2","#a7c7bf","#709d8d"],sunset:["#f0d6df","#a9b7cb","#839da9"],
 flowers:["#dce8f8","#c2ddcf","#78ad91"],universe:["#343958","#c8b8e5","#6b719e"],
 cat:["#e5eff8","#f7e7d9","#d6b8c8"],rainbow:["#d9eafa","#e8a9c7","#a8b8e6"]};
 const c=colors[type]||colors.meadow;
 const sun=type==="universe"?"<circle cx='245' cy='145' r='108' fill='#c8b8e5'/><ellipse cx='245' cy='145' rx='152' ry='39' fill='none' stroke='#f7d9ef' stroke-width='7' transform='rotate(-24 245 145)'/>":`<circle cx="375" cy="60" r="29" fill="#fff1c9"/>`;
 const hills=type==="cat"?"<circle cx='240' cy='155' r='78' fill='#f7e7d9'/><path d='M176 105L177 49 220 91M260 91L303 49 304 108' fill='#f7e7d9' stroke='#9e8995' stroke-width='5'/><circle cx='213' cy='150' r='7' fill='#665873'/><circle cx='267' cy='150' r='7' fill='#665873'/>":`<path d="M0 200 Q95 95 180 190 T360 174 T480 190 V300 H0Z" fill="${c[1]}"/><path d="M0 245 Q130 170 250 235 T480 220 V300 H0Z" fill="${c[2]}"/>`;
 return "data:image/svg+xml;charset=UTF-8,"+encodeURIComponent(`<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 480 300"><defs><linearGradient id="s" x2="0" y2="1"><stop stop-color="${c[0]}"/><stop offset="1" stop-color="#f8e6ee"/></linearGradient></defs><rect width="480" height="300" fill="url(#s)"/>${sun}${hills}</svg>`);
}
function applySettings(){
 $("#pcname").textContent=(settings.pcname||defaults.pcname).replace(/♡/g,"").trim();
 $("#avatar").src=settings.avatar||art("flowers");
 $("#wallpaper").style.backgroundImage=settings.wallpaper==="image"&&settings.wallpaperImage?`url("${settings.wallpaperImage}")`:settings.wallpaper==="solid"?settings.wallColor:`linear-gradient(135deg,${settings.wallColor},${settings.wallColor2})`;
 $("#wallpaper").style.backgroundColor=settings.wallColor;
}
apps.forEach(a=>{
 const b=document.createElement("button");b.className="app";b.innerHTML=`<span class="emoji">${a.icon}</span><span>${a.name}</span>`;b.onclick=()=>openApp(a.id);icons.append(b);
 const s=document.createElement("button");s.textContent=a.icon+"  "+a.name;s.onclick=()=>{$("#startMenu").style.display="none";openApp(a.id)};startApps.append(s);
});
$("#startBtn").onclick=()=>{$("#startMenu").style.display=$("#startMenu").style.display==="block"?"none":"block"};
function shell(id,title,content,wide=false){
 let w=$("#win-"+id);
 if(w){w.style.display="block";w.style.zIndex=++z;addTask(id,title);return w}
 w=document.createElement("section");w.className="window"+(wide?" wide":"");w.id="win-"+id;w.style.zIndex=++z;
 w.innerHTML=`<div class="titlebar"><span>🌷</span><strong>${title}</strong><button class="winbtn" data-act="min">—</button><button class="winbtn" data-act="max">□</button><button class="winbtn" data-act="close">×</button></div><div class="winbody">${content}</div>`;
 windows.append(w);
 w.querySelector('[data-act="close"]').onclick=()=>{w.style.display="none";removeTask(id);if(id==="clock"&&clockTimer){clearInterval(clockTimer);clockTimer=null}};
 w.querySelector('[data-act="min"]').onclick=()=>{w.style.display="none";if(id==="clock"&&clockTimer){clearInterval(clockTimer);clockTimer=null}};
 w.querySelector('[data-act="max"]').onclick=()=>w.classList.toggle("maximized");
 w.addEventListener("mousedown",()=>w.style.zIndex=++z);drag(w);addTask(id,title);return w;
}
function drag(w){
 const bar=w.querySelector(".titlebar");let down=false,ox=0,oy=0;
 bar.addEventListener("pointerdown",e=>{if(e.target.closest("button")||w.classList.contains("maximized"))return;down=true;const r=w.getBoundingClientRect();ox=e.clientX-r.left;oy=e.clientY-r.top;w.style.transform="none";w.style.left=r.left+"px";w.style.top=r.top+"px";bar.setPointerCapture(e.pointerId)});
 bar.addEventListener("pointermove",e=>{if(!down)return;w.style.left=Math.max(0,Math.min(innerWidth-w.offsetWidth,e.clientX-ox))+"px";w.style.top=Math.max(0,Math.min(innerHeight-w.offsetHeight-52,e.clientY-oy))+"px"});
 bar.addEventListener("pointerup",()=>down=false);bar.addEventListener("pointercancel",()=>down=false);
}
function addTask(id,title){
 let b=$("#task-"+id);if(!b){b=document.createElement("button");b.id="task-"+id;b.className="taskApp";$("#taskApps").append(b)}
 b.textContent=(apps.find(a=>a.id===id)?.icon||"🪟")+" "+title;
 b.onclick=()=>{const w=$("#win-"+id);if(!w)return;w.style.display=w.style.display==="none"?"block":"none";if(w.style.display==="block")w.style.zIndex=++z};
}
function removeTask(id){$("#task-"+id)?.remove()}
function openApp(id){({gallery:openGallery,paint:openPaint,files:openFiles,notes:openNotes,calc:openCalc,clock:openClock,trash:openTrash,calendar:openCalendar,secret:()=>openSecret(),settings:openSettings,chat:openChat})[id]?.()}

/* Xem ảnh phóng to */
function showImage(src,name){$("#viewerImage").src=src;$("#viewerCaption").textContent=name||"";$("#imageViewer").classList.add("show")}
function closeImageViewer(){$("#imageViewer").classList.remove("show");$("#viewerImage").src=""}
$("#viewerClose").onclick=closeImageViewer;
$("#imageViewer").onclick=e=>{if(e.target.id==="imageViewer")closeImageViewer()};
document.addEventListener("keydown",e=>{if(e.key==="Escape"){closeImageViewer();closeScare()}});

/* GALLERY */
function openGallery(){
 const w=shell("gallery","Gallery · Nature",`<div class="row"><button id="gUpload">＋ Tải ảnh lên</button><button id="gNew">🌿 Thêm tranh</button><button id="gSearch">🔎 Tìm ảnh</button></div><p class="muted">Bấm vào ảnh để phóng to. Tranh từ Paint cũng xuất hiện ở đây.</p><div id="galleryGrid" class="grid"></div>`,true);
 const b=w.querySelector(".winbody"),grid=b.querySelector("#galleryGrid");
 function render(){
  grid.innerHTML="";
  gallery.forEach((it,i)=>{
   const card=document.createElement("div");card.className="photo";
   const im=document.createElement("img");im.src=it.src;im.alt=it.name;im.title="Bấm để phóng to";im.onclick=()=>showImage(it.src,it.name);
   const info=document.createElement("div");info.className="pinfo";
   const name=document.createElement("b");name.textContent=it.name;
   const save=document.createElement("button");save.textContent="⬇ Lưu";save.onclick=()=>{const a=document.createElement("a");a.href=it.src;const ext=it.src.startsWith("data:image/png")?"png":it.src.startsWith("data:image/jpeg")?"jpg":"svg";a.download=it.name.replace(/[^\w\-]+/g,"-")+"."+ext;a.click()};
   const del=document.createElement("button");del.textContent="🗑️ Xoá";del.onclick=()=>{trash.push(it);gallery.splice(i,1);render()};
   info.append(name,document.createElement("br"),save,del);card.append(im,info);grid.append(card);
  });
 }
 if(!gallery.length)[["Flower Meadow","meadow"],["Peaceful Sea","sea"],["Dreamy Forest","forest"],["Soft Sunset","sunset"],["Flower Garden","flowers"],["Pastel Universe","universe"],["Cute Cat","cat"],["Pastel Rainbow","rainbow"]].forEach(([name,type])=>gallery.push({name,src:art(type)}));
 render();
 b.querySelector("#gUpload").onclick=()=>$("#galleryUpload").click();
 b.querySelector("#gNew").onclick=()=>{const types=["meadow","sea","forest","sunset","flowers","universe","cat","rainbow"];gallery.push({name:"Nature art "+(gallery.length+1),src:art(types[gallery.length%types.length])});render()};
 b.querySelector("#gSearch").onclick=()=>window.open("https://www.google.com/search?tbm=isch&q=pastel+nature+wallpaper","_blank");
 $("#galleryUpload").onchange=e=>{[...e.target.files].forEach(f=>dataImage(f,src=>{gallery.push({name:f.name,src});render()}));e.target.value=""};
}

/* PAINT — bút vẽ + bộ hình dạng phong phú kiểu PowerPoint */
function openPaint(){
 const w=shell("paint","Paint · Art studio",`
  <div class="row">
   <button id="pUpload">🖼️ Tải ảnh</button>
   <label>Màu <input id="pColor" type="color" value="#c58ccf"></label>
   <label>Nét <input id="pSize" type="range" min="1" max="30" value="5"></label>
   <button id="pErase">🧽 Tẩy</button><button id="pDraw">✏️ Bút vẽ</button>
   <button id="pUndo">↩ Hoàn tác</button><button id="pRedo">↪ Làm lại</button><button id="pClear">Làm mới</button><button id="pSave">⬇ Lưu PNG</button>
   <button id="pToGallery">🖼️ Lưu vào Gallery</button>
  </div>
  <div id="shapeTools">
   <div class="row">
    <span class="tool-label">🔷 Công cụ vẽ hình:</span>
    <select id="pShape" aria-label="Chọn hình dạng">
     <optgroup label="Nét vẽ">
      <option value="pen">✏️ Bút vẽ tự do</option><option value="line">╱ Đường thẳng</option><option value="arrow">➡️ Mũi tên</option><option value="doubleArrow">↔️ Mũi tên hai đầu</option>
     </optgroup>
     <optgroup label="Hình cơ bản">
      <option value="rect">▭ Hình chữ nhật</option><option value="square">◻️ Hình vuông</option><option value="roundRect">▢ Hình chữ nhật bo góc</option><option value="ellipse">⬭ Hình oval</option><option value="circle">⭕ Hình tròn</option><option value="triangle">🔺 Tam giác</option><option value="rightTriangle">◢ Tam giác vuông</option><option value="diamond">🔶 Hình thoi</option>
     </optgroup>
     <optgroup label="Đa giác">
      <option value="pentagon">⬠ Ngũ giác</option><option value="hexagon">⬡ Lục giác</option><option value="octagon">🛑 Bát giác</option><option value="star5">⭐ Ngôi sao 5 cánh</option><option value="star6">✳️ Ngôi sao 6 cánh</option>
     </optgroup>
     <optgroup label="Mũi tên & ký hiệu">
      <option value="leftArrow">⬅️ Mũi tên trái</option><option value="rightArrow">➡️ Mũi tên phải</option><option value="upArrow">⬆️ Mũi tên lên</option><option value="downArrow">⬇️ Mũi tên xuống</option><option value="chevron">❯ Dấu chevron</option><option value="plus">➕ Dấu cộng</option><option value="cross">✚ Dấu chữ thập</option><option value="lightning">⚡ Tia sét</option>

 const noteGap=.9, noteLength=.78, repeats=7, start=ctx.currentTime+.05;
 for(let r=0;r<repeats;r++) notes.forEach((freq,i)=>{const osc=ctx.createOscillator(),gain=ctx.createGain(),at=start+(r*notes.length+i)*noteGap;osc.type=(style==='power'||style==='retro'||style==='marimba')?'triangle':'sine';osc.frequency.value=freq;gain.gain.setValueAtTime(.0001,at);gain.gain.exponentialRampToValueAtTime(.14,at+.08);gain.gain.setValueAtTime(.14,at+noteLength*.55);gain.gain.exponentialRampToValueAtTime(.0001,at+noteLength);osc.connect(gain);gain.connect(ctx.destination);osc.start(at);osc.stop(at+noteLength+.02);alarmNodes.push(osc)});
}

 const b=w.querySelector(".winbody");b.querySelectorAll("[data-preset]").forEach(btn=>btn.onclick=()=>{b.querySelector("#timerMin").value=btn.dataset.preset});function tick(){if(w.style.display==="none")return;const d=new Date();b.querySelector("#bigClock").textContent=d.toLocaleTimeString("vi-VN");b.querySelector("#bigDate").textContent=d.toLocaleDateString("vi-VN",{weekday:"long",year:"numeric",month:"long",day:"numeric"})}

 b.querySelector("#timerStop").onclick=()=>{if(activeTimer)clearInterval(activeTimer);activeTimer=null;stopAlarm();b.querySelector("#timerStatus").textContent="Đã dừng đồng hồ."};b.querySelector("#alarmTest").onclick=()=>{playAlarm(b.querySelector("#alarmStyle").value);b.querySelector("#timerStatus").textContent="Đang thử tiếng báo…"};

function openTrash(){

 function render(){
  b.querySelector("#tCount").textContent=trash.length+" mục trong thùng rác";list.innerHTML="";
  if(!trash.length){list.innerHTML='<div class="panel" style="text-align:center;padding:35px">🌱 Thùng rác đang trống!</div>';return}
  trash.forEach((it,i)=>{const row=document.createElement("div");row.className="trashItem";const em=document.createElement("span");em.textContent="🖼️";const name=document.createElement("span");name.className="name";name.textContent=it.name;const restore=document.createElement("button");restore.textContent="↩ Khôi phục";restore.onclick=()=>{gallery.push(it);trash.splice(i,1);render()};const del=document.createElement("button");del.textContent="Xoá hẳn";del.onclick=()=>{trash.splice(i,1);render()};row.append(em,name,restore,del);list.append(row)});

/* CALENDAR — simple monthly calendar with notes per day */
function openCalendar(){
 const w=shell("calendar","Calendar · Pastel days",`<div class="row" style="justify-content:space-between;align-items:center"><button id="calPrev">‹ Tháng trước</button><h3 id="calTitle" style="margin:0;text-align:center;flex:1"></h3><button id="calNext">Tháng sau ›</button></div><div id="calGrid" style="display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:5px;margin-top:14px"></div><div class="panel" style="margin-top:14px"><b id="calSelected"></b><textarea id="calNote" placeholder="Ghi chú cho ngày này..." style="width:100%;min-height:85px;margin-top:8px"></textarea><div class="row" style="margin-top:8px"><button id="calSave">💾 Lưu ghi chú</button><span id="calStatus" class="muted"></span></div></div>`,true);
 const b=w.querySelector(".winbody"),grid=b.querySelector("#calGrid"),now=new Date();let year=now.getFullYear(),month=now.getMonth(),selected=now.getDate();const key=(y,m,d)=>`pastelPC_calendar_${y}-${String(m+1).padStart(2,"0")}-${String(d).padStart(2,"0")}`;
 function loadNote(){b.querySelector("#calSelected").textContent=new Date(year,month,selected).toLocaleDateString("vi-VN",{weekday:"long",day:"numeric",month:"long",year:"numeric"});try{b.querySelector("#calNote").value=localStorage.getItem(key(year,month,selected))||""}catch{b.querySelector("#calNote").value=""}b.querySelector("#calStatus").textContent=""}
 function render(){grid.innerHTML="";b.querySelector("#calTitle").textContent=new Date(year,month,1).toLocaleDateString("vi-VN",{month:"long",year:"numeric"});["T2","T3","T4","T5","T6","T7","CN"].forEach(day=>{const h=document.createElement("div");h.textContent=day;h.style.cssText="text-align:center;font-weight:bold;padding:5px 0;font-size:12px";grid.append(h)});const first=(new Date(year,month,1).getDay()+6)%7,total=new Date(year,month+1,0).getDate();for(let i=0;i<first;i++)grid.append(document.createElement("div"));for(let d=1;d<=total;d++){const btn=document.createElement("button");btn.textContent=d;btn.style.cssText="padding:9px 0;min-width:0;border-radius:10px";if(d===selected)btn.style.outline="2px solid #b8a1dc";if(year===now.getFullYear()&&month===now.getMonth()&&d===now.getDate())btn.style.fontWeight="bold";try{if(localStorage.getItem(key(year,month,d)))btn.textContent=d+" ·"}catch{}btn.onclick=()=>{selected=d;render();loadNote()};grid.append(btn)}loadNote()}
 b.querySelector("#calPrev").onclick=()=>{month--;if(month<0){month=11;year--}selected=Math.min(selected,new Date(year,month+1,0).getDate());render()};b.querySelector("#calNext").onclick=()=>{month++;if(month>11){month=0;year++}selected=Math.min(selected,new Date(year,month+1,0).getDate());render()};b.querySelector("#calSave").onclick=()=>{try{const val=b.querySelector("#calNote").value;if(val.trim())localStorage.setItem(key(year,month,selected),val);else localStorage.removeItem(key(year,month,selected));b.querySelector("#calStatus").textContent="Đã lưu ghi chú ♡";render()}catch{b.querySelector("#calStatus").textContent="Không thể lưu ghi chú"}};render();
}
